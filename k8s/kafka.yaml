apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: kafka }
  ports:
    - { name: broker, port: 9092 }
    - { name: controller, port: 9093 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports:
            - { containerPort: 9092, name: broker }
          env:
            - { name: KAFKA_NODE_ID, value: '1' }
            - { name: KAFKA_PROCESS_ROLES, value: 'broker,controller' }
            - { name: KAFKA_LISTENERS, value: 'PLAINTEXT://:9092,CONTROLLER://:9093' }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: 'PLAINTEXT://kafka:9092' }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT' }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: '1@kafka:9093' }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: '1' }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: '1' }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: '1' }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: '0' }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: 'false' }
            - { name: KAFKA_LOG_DIRS, value: '/var/lib/kafka/data/logs' }
            - { name: KAFKA_HEAP_OPTS, value: '-Xms256m -Xmx384m' }
            - { name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk }
          volumeMounts:
            - { name: kafka-data, mountPath: /var/lib/kafka/data }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: '1', memory: 768Mi }
          startupProbe:
            tcpSocket: { port: broker }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            tcpSocket: { port: broker }
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ['env', 'KAFKA_HEAP_OPTS=-Xms32m -Xmx64m', '/opt/kafka/bin/kafka-topics.sh', '--bootstrap-server', 'localhost:9092', '--list']
            periodSeconds: 15
            timeoutSeconds: 8
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata: { name: kafka-data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 2Gi }
